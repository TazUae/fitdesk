<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Blue background -->
  <rect width="512" height="512" fill="#1A73E8"/>

  <!-- White card with rounded corners -->
  <rect x="76" y="76" width="360" height="360" rx="16" fill="#FFFFFF"/>

  <!-- Dumbbell icon (left side) -->
  <g opacity="0.7">
    <!-- Left weight -->
    <circle cx="102" cy="153" r="16" fill="#999999"/>
    <!-- Bar -->
    <rect x="118" y="149" width="32" height="8" fill="#999999"/>
    <!-- Right weight -->
    <circle cx="166" cy="153" r="16" fill="#999999"/>
  </g>

  <!-- Progress circle (center) -->
  <circle cx="256" cy="283" r="36" fill="none" stroke="#DDDDDD" stroke-width="6"/>
  <circle cx="256" cy="283" r="36" fill="none" stroke="#1A73E8" stroke-width="6"
          stroke-dasharray="160 76" stroke-dashoffset="0" stroke-linecap="round"/>

  <!-- Green checkmark badge (bottom right) -->
  <circle cx="380" cy="356" r="32" fill="#188038"/>

  <!-- Checkmark -->
  <g stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 365 356 L 372 365 L 395 340"/>
  </g>
</svg>
